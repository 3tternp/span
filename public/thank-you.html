<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      var t = 'light';
      try {
        var s = localStorage.getItem('theme');
        if (s === 'light' || s === 'dark') t = s;
        else { var h = new Date().getHours(); t = h >= 6 && h < 18 ? 'light' : 'dark'; }
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <title>Message sent | Prem Basnet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Newsreader:opsz,wght@6..72,400;500&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --paper: #f6f3ed; --ink: #1d1c1a; --muted: #5f5b53; --accent: #1f5d4a; --accent-hover: #154436; --on-accent: #fff; }
    :root[data-theme="dark"] { color-scheme: dark; --paper: #0e1311; --ink: #ebe7de; --muted: #a3aaa3; --accent: #5fc9a0; --accent-hover: #86dcb9; --on-accent: #0a1410; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
           background: var(--paper); color: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif; line-height: 1.6; }
    main { max-width: 520px; }
    h1 { font-family: "Newsreader", Georgia, serif; font-weight: 400; font-size: 2.5rem; line-height: 1.15; margin: 0 0 1rem; }
    p { color: var(--muted); margin: 0 0 1.5rem; }
    a.btn { display: inline-block; padding: 10px 20px; background: var(--accent); color: var(--on-accent); text-decoration: none; }
    a.btn:hover { background: var(--accent-hover); }
    a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Thanks, your message is on its way.</h1>
    <p>I read every message and will reply by email, usually within a couple of working days.</p>
    <a class="btn" href="https://basnetprem.com.np">Back to the portfolio</a>
  </main>
</body>
</html>
